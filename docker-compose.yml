# Postgres + API do painel.
#   docker compose up -d --build                 # sobe banco (7432), API (7333) e MCP (7335)
#   docker compose run --rm api npm run etl      # planilha bronze (docs/) → Postgres
#   docker compose run --rm api npm run etl:check
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saude
      POSTGRES_PASSWORD: saude
      POSTGRES_DB: saude_rotas
    ports:
      - '7432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saude -d saude_rotas']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    environment:
      DATABASE_URL: postgres://saude:saude@db:5432/saude_rotas
      PORT: 7333
      DATA_SOURCE: ${DATA_SOURCE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      MCP_URL: http://mcp:7335/mcp
      MCP_ESCOPO_SECRET: ${MCP_ESCOPO_SECRET:-checkroute-escopo-dev}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-checkroute-interno-dev}
      # Contatos de teste do WhatsApp (seu número): telefone:nome:papel:T02,T05;outro...
      WA_CONTATOS_DEMO: ${WA_CONTATOS_DEMO:-}
      BRONZE_PATH: /bronze/bronze_planilha.xlsx
    volumes:
      # A planilha bronze não vai para a imagem: é lida de docs/ na hora do ETL.
      - ./docs:/bronze:ro
    ports:
      - '7333:7333'
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: unless-stopped

  # Servidor MCP: dados específicos da rota para a IA, só leitura (papel checkroute_leitura) e com escopo assinado.
  mcp:
    build:
      context: .
      dockerfile: app/mcp/Dockerfile
    environment:
      PORT: 7335
      DATABASE_URL_LEITURA: postgres://checkroute_leitura:${LEITURA_PASSWORD:-leitura}@db:5432/saude_rotas
      MCP_ESCOPO_SECRET: ${MCP_ESCOPO_SECRET:-checkroute-escopo-dev}
    ports:
      - '7335:7335'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Agente de WhatsApp (Meta Cloud API + Claude). Webhook em http://localhost:7334/webhook
  # (exponha com um túnel HTTPS, ex.: ngrok, e cadastre a URL no app da Meta). Ver app/whatsapp/README.md.
  whatsapp:
    build:
      context: .
      dockerfile: app/whatsapp/Dockerfile
    environment:
      PORT: 7334
      API_URL: http://api:7333
      DATABASE_URL: postgres://saude:saude@db:5432/saude_rotas
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_DRY_RUN: ${META_DRY_RUN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WA_MODELO: ${WA_MODELO:-claude-opus-5-5}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WA_TRANSCRICAO_MODELO: ${WA_TRANSCRICAO_MODELO:-openai/whisper-1}
      WA_TRANSCRICAO_IDIOMA: ${WA_TRANSCRICAO_IDIOMA:-pt}
      WA_ADMIN_TOKEN: ${WA_ADMIN_TOKEN:-}
      WA_CORS_ORIGENS: ${WA_CORS_ORIGENS:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-checkroute-interno-dev}
      MCP_URL: http://mcp:7335/mcp
    ports:
      - '7334:7334'
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      mcp:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
